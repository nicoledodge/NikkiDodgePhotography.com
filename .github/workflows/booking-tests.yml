name: Booking checks
on:
  pull_request:
    branches: [main, www]
  push:
    branches: [codex/client-booking]
permissions:
  contents: read
jobs:
  booking-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: booking_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking_test -d booking_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://booking_test:disposable_ci_password@127.0.0.1:5432/booking_test
      BOOKING_TEST_DATABASE_URL: postgres://booking_test:disposable_ci_password@127.0.0.1:5432/booking_test
      BOOKING_INTEGRATION_TEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:booking

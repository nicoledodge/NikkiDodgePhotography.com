name: Build and Deploy

on:
  push:
    branches:
      - main
      - www
  workflow_dispatch:
    inputs:
      use_last_image:
        description: "Skip build and redeploy last branch image"
        required: false
        type: boolean
        default: false
      namespace:
        description: "Override target namespace"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  APP_NAME: nikkidodgephotography
  SERVICE_TYPE: ClusterIP
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker-build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build_meta.outputs.image || steps.reused_meta.outputs.image }}
      latest_tag: ${{ steps.build_meta.outputs.latest_tag || steps.reused_meta.outputs.latest_tag }}
      branch_slug: ${{ steps.build_meta.outputs.branch_slug || steps.reused_meta.outputs.branch_slug }}
      use_last_image: ${{ steps.decision.outputs.use_last_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to reuse existing image
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          reuse="false"
          event="${{ github.event_name }}"
          dispatch_flag="${{ github.event.inputs.use_last_image || 'false' }}"
          commit_message="${{ github.event.head_commit.message || '' }}"
          if [[ "$event" == "workflow_dispatch" && "$dispatch_flag" == "true" ]]; then
            reuse="true"
          elif [[ "$event" == "push" ]]; then
            shopt -s nocasematch
            if [[ "$commit_message" =~ \[use-last-image\] || "$commit_message" =~ \[deploy:last\] ]]; then
              reuse="true"
            fi
            shopt -u nocasematch
          fi
          echo "use_last_image=${reuse}" | tee -a "$GITHUB_OUTPUT"

      - name: Compute image metadata
        if: steps.decision.outputs.use_last_image != 'true'
        id: build_meta
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME:-${GITHUB_HEAD_REF:-}}"
          if [[ -z "$branch" ]]; then
            branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")
          fi
          slug=$(echo "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9_.-]+#-#g; s#-+#-#g; s#^-+##; s#-+$##')
          if [[ -z "$slug" ]]; then
            slug="branch"
          fi
          repo="${GITHUB_REPOSITORY,,}"
          image_repo="${REGISTRY}/${repo}"
          short_sha="${GITHUB_SHA::12}"
          image_tag="${slug}-${short_sha}"
          echo "branch_slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "image_repo=${image_repo}" >> "$GITHUB_OUTPUT"
          echo "image=${image_repo}:${image_tag}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${slug}-latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.decision.outputs.use_last_image != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.decision.outputs.use_last_image != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.decision.outputs.use_last_image != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_PORTFOLIO_IMAGE_BASE_URL=${{ vars.PORTFOLIO_IMAGE_BASE_URL }}
          tags: |
            ${{ steps.build_meta.outputs.image }}
            ${{ steps.build_meta.outputs.image_repo }}:${{ steps.build_meta.outputs.latest_tag }}

      - name: Export reused metadata
        if: steps.decision.outputs.use_last_image == 'true'
        id: reused_meta
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME:-${GITHUB_HEAD_REF:-}}"
          if [[ -z "$branch" ]]; then
            branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")
          fi
          slug=$(echo "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9_.-]+#-#g; s#-+#-#g; s#^-+##; s#-+$##')
          if [[ -z "$slug" ]]; then
            slug="branch"
          fi
          repo="${GITHUB_REPOSITORY,,}"
          image_repo="${REGISTRY}/${repo}"
          echo "branch_slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "image_repo=${image_repo}" >> "$GITHUB_OUTPUT"
          echo "image=${image_repo}:${slug}-latest" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${slug}-latest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build-push
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.docker-build-push.outputs.image }}
      BRANCH_SLUG: ${{ needs.docker-build-push.outputs.branch_slug }}
      USE_LAST_IMAGE: ${{ needs.docker-build-push.outputs.use_last_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -sSL "https://dl.k8s.io/release/v1.30.4/bin/linux/amd64/kubectl" -o kubectl
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Prepare kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          cat > ~/.kube/config <<'KUBECONFIG'
          ${{ secrets.HARVESTER_KUBECONFIG }}
          KUBECONFIG
          chmod 600 ~/.kube/config
          if ! kubectl config current-context >/dev/null 2>&1; then
            echo "HARVESTER_KUBECONFIG is empty or invalid" >&2
            exit 1
          fi
          kubectl config view

      - name: Pick namespace
        id: namespace
        shell: bash
        env:
          INPUT_NAMESPACE: ${{ github.event.inputs.namespace }}
          PROD_NAMESPACE: ${{ vars.PROD_NAMESPACE }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME:-${GITHUB_HEAD_REF:-}}"
          if [[ -z "$branch" ]]; then
            branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
          fi
          default_branch="${{ github.event.repository.default_branch }}"
          prod_namespace="${PROD_NAMESPACE:-default}"
          if [[ -n "$INPUT_NAMESPACE" ]]; then
            namespace="$INPUT_NAMESPACE"
          elif [[ -n "$branch" && "$branch" == "$default_branch" ]]; then
            namespace="$prod_namespace"
          else
            namespace="development"
          fi
          echo "namespace=${namespace}" | tee -a "$GITHUB_OUTPUT"

      - name: Compute hostname
        id: hostname
        shell: bash
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          PROD_HOSTNAME: ${{ vars.PROD_HOSTNAME }}
          DEFAULT_PROD_HOSTNAME: nikkidodgephotography.com,www.nikkidodgephotography.com
        run: |
          set -euo pipefail
          namespace="${{ steps.namespace.outputs.namespace }}"
          if [[ "$namespace" == "default" ]]; then
            hostname="${PROD_HOSTNAME:-$DEFAULT_PROD_HOSTNAME}"
            echo "hostname=${hostname}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_DOMAIN" ]]; then
            echo "hostname=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          slug="${BRANCH_SLUG:-${{ needs.docker-build-push.outputs.branch_slug }}}"
          echo "hostname=${slug}.${BASE_DOMAIN}" >> "$GITHUB_OUTPUT"

      - name: Deploy manifests
        env:
          KUBECONFIG: /home/runner/.kube/config
          NAMESPACE: ${{ steps.namespace.outputs.namespace }}
          APP_NAME: ${{ env.APP_NAME }}
          IMAGE_PULL_SECRET: ${{ vars.IMAGE_PULL_SECRET_NAME }}
          HOSTNAME: ${{ steps.hostname.outputs.hostname }}
          TLS_SECRET: ${{ vars.TLS_SECRET_NAME || 'nikkidodgephotography-tls' }}
          SECRET_NAME: ${{ vars.APP_SECRET_NAME }}
          SERVICE_TYPE: ${{ env.SERVICE_TYPE }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-k8s.sh
          ./scripts/deploy-k8s.sh

      - name: Show service summary
        run: |
          kubectl -n ${{ steps.namespace.outputs.namespace }} get deploy,svc,ingress -o wide || true
